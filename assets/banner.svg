<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="50%" stop-color="#140f2d"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <!-- Accent Linear Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>

    <linearGradient id="stream-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pixel Grid Pattern -->
    <pattern id="pixel-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2a1f4e" stroke-width="0.8" opacity="0.35"/>
    </pattern>

    <pattern id="pixel-dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="3" height="3" fill="#ff007f" opacity="0.2"/>
      <rect x="24" y="24" width="3" height="3" fill="#00f2fe" opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes signalPulse {
      0% { r: 6px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }
    @keyframes blinkPixel {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.9; }
    }

    .orb-glow { animation: pulseOrb 6s ease-in-out infinite; transform-origin: center; }
    .floating-box { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
    .scanline { animation: scanlineAnim 7s linear infinite; }
    .broadcasting-wave { animation: signalPulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .pixel-blink-1 { animation: blinkPixel 2.5s ease-in-out infinite; }
    .pixel-blink-2 { animation: blinkPixel 3.5s ease-in-out 1s infinite; }
    .pixel-blink-3 { animation: blinkPixel 1.8s ease-in-out 0.5s infinite; }
  </style>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Pixel Grid Backdrop -->
  <rect width="1200" height="420" fill="url(#pixel-grid)"/>
  <rect width="1200" height="420" fill="url(#pixel-dots)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-glow">
    <circle cx="150" cy="100" r="140" fill="#7928ca" filter="url(#neon-glow)"/>
    <circle cx="1050" cy="300" r="160" fill="#ff007f" filter="url(#neon-glow)"/>
    <circle cx="850" cy="90" r="110" fill="#00f2fe" filter="url(#neon-glow)"/>
  </g>

  <!-- Streaming Signal Laser Beam in Background -->
  <path d="M 0 340 Q 600 240 1200 370" stroke="url(#stream-beam)" stroke-width="14" fill="none" opacity="0.45" filter="url(#soft-glow)"/>

  <!-- Scanning Beam Effect (Kept strictly behind text) -->
  <g opacity="0.08" class="scanline">
    <rect x="0" y="0" width="1200" height="80" fill="url(#accent-cyan)"/>
  </g>

  <!-- Animated Pixel Art Floating Blocks (Decorations in corners/background) -->
  <g class="floating-box" style="transform-origin: 1060px 120px;">
    <!-- Retro 8-bit Sprite Character / Heart / Broadcast Icon in Background -->
    <rect x="1040" y="90" width="10" height="10" fill="#ff007f" class="pixel-blink-1"/>
    <rect x="1050" y="90" width="10" height="10" fill="#ff007f" class="pixel-blink-1"/>
    <rect x="1070" y="90" width="10" height="10" fill="#ff007f" class="pixel-blink-1"/>
    <rect x="1080" y="90" width="10" height="10" fill="#ff007f" class="pixel-blink-1"/>

    <rect x="1030" y="100" width="10" height="10" fill="#ff007f"/>
    <rect x="1040" y="100" width="10" height="10" fill="#ff52a2"/>
    <rect x="1050" y="100" width="10" height="10" fill="#ffffff"/>
    <rect x="1060" y="100" width="10" height="10" fill="#ff007f"/>
    <rect x="1070" y="100" width="10" height="10" fill="#ff52a2"/>
    <rect x="1080" y="100" width="10" height="10" fill="#ff007f"/>
    <rect x="1090" y="100" width="10" height="10" fill="#ff007f"/>

    <rect x="1030" y="110" width="10" height="10" fill="#ff007f"/>
    <rect x="1040" y="110" width="10" height="10" fill="#ffffff"/>
    <rect x="1050" y="110" width="10" height="10" fill="#ff007f"/>
    <rect x="1060" y="110" width="10" height="10" fill="#ff007f"/>
    <rect x="1070" y="110" width="10" height="10" fill="#ff007f"/>
    <rect x="1080" y="110" width="10" height="10" fill="#ff007f"/>
    <rect x="1090" y="110" width="10" height="10" fill="#ff007f"/>

    <rect x="1040" y="120" width="10" height="10" fill="#ff007f"/>
    <rect x="1050" y="120" width="10" height="10" fill="#ff007f"/>
    <rect x="1060" y="120" width="10" height="10" fill="#ff007f"/>
    <rect x="1070" y="120" width="10" height="10" fill="#ff007f"/>
    <rect x="1080" y="120" width="10" height="10" fill="#ff007f"/>

    <rect x="1050" y="130" width="10" height="10" fill="#ff007f"/>
    <rect x="1060" y="130" width="10" height="10" fill="#ff007f"/>
    <rect x="1070" y="130" width="10" height="10" fill="#ff007f"/>

    <rect x="1060" y="140" width="10" height="10" fill="#ff007f"/>
  </g>

  <!-- Left Side Pixel Sprite Tower / Stream Tower -->
  <g class="floating-box" style="transform-origin: 90px 280px;">
    <rect x="80" y="240" width="8" height="8" fill="#00f2fe" class="pixel-blink-2"/>
    <rect x="88" y="240" width="8" height="8" fill="#00f2fe"/>
    <rect x="96" y="240" width="8" height="8" fill="#00f2fe" class="pixel-blink-3"/>
    <rect x="88" y="232" width="8" height="8" fill="#38ef7d"/>
    <rect x="88" y="224" width="8" height="8" fill="#ff007f"/>
    <!-- Animated broadcast rings from the antenna -->
    <circle cx="92" cy="220" r="6" stroke="#00f2fe" stroke-width="2" fill="none" class="broadcasting-wave"/>
    <circle cx="92" cy="220" r="6" stroke="#ff007f" stroke-width="2" fill="none" class="broadcasting-wave" style="animation-delay: 1s;"/>
  </g>

  <!-- Foreground Frame Header (Clean & Solid to protect Title/Subtitle) -->
  <g id="foreground-content">
    <!-- Live Broadcast Indicator Tag -->
    <g transform="translate(100, 75)">
      <rect x="0" y="0" width="168" height="30" rx="15" fill="#1b143a" stroke="#7928ca" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="5" fill="#ff0055" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="'Courier New', monospace, sans-serif" font-weight="bold" font-size="12" fill="#00f2fe" letter-spacing="2">● LIVE CURATION</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#title-grad)" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome 2D Sprite Animation
    </text>
    <text x="100" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      &amp; Pixel Art Broadcasting 🎨✨
    </text>

    <!-- Subtitle / Tagline -->
    <text x="100" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#b8c1ec" letter-spacing="0.2">
      Curated Open-Source Editors, Timeline Suites, Game Dev Engines &amp; Streaming Solutions
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(100, 285)">
      <!-- Pill 1: Pixel Art -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="34" rx="6" fill="#1b1238" stroke="#ff007f" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ff70a6">👾 Pixel Art Tools</text>
      </g>
      <!-- Pill 2: 2D Animation -->
      <g transform="translate(157, 0)">
        <rect x="0" y="0" width="168" height="34" rx="6" fill="#151b3b" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4facfe">🎬 Sprite Animation</text>
      </g>
      <!-- Pill 3: Live Broadcasting -->
      <g transform="translate(337, 0)">
        <rect x="0" y="0" width="162" height="34" rx="6" fill="#1a1236" stroke="#a855f7" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c084fc">📡 Live Streaming</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(511, 0)">
        <rect x="0" y="0" width="155" height="34" rx="6" fill="#10232b" stroke="#38ef7d" stroke-width="1.5"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38ef7d">🌟 100% Free / OSS</text>
      </g>
    </g>

    <!-- Bottom Accent Border -->
    <rect x="100" y="360" width="1000" height="2" fill="url(#title-grad)" opacity="0.6"/>
  </g>
</svg>
